<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Silo Monitor - Evenly Spaced Grey Mark with Pink Telemetry (Solid Midnight Navy)</title>
  <defs>
    <!-- Solid rich deep navy background -->
    <rect id="bg" width="1024" height="1024" rx="224" fill="#010a48"/>

    <!-- Neutral Plex-Dash style slate-grey fill -->
    <linearGradient id="grey-metallic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a989d"/>
      <stop offset="100%" stop-color="#6e6c72"/>
    </linearGradient>

    <!-- Drop shadow for depth on dark background -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="1024" height="1024" rx="224" fill="#010a48"/>

  <!-- Silo mark in grey with perfectly uniform 40px spacing -->
  <g filter="url(#shadow)" fill="url(#grey-metallic)">
    <!-- Top Play Triangle -->
    <path d="M 415.7 98.9 L 598.7 190.8 Q 645.0 214.0 598.7 237.2 L 415.7 329.1 Q 378.0 348.0 378.0 305.9 L 378.0 122.1 Q 378.0 80.0 415.7 98.9 Z"/>

    <!-- Rhombus 1 (even 40px gap from triangle) -->
    <path fill-rule="evenodd" d="M 392.3 380.8 L 607.3 272.9 Q 645.0 254.0 645.0 296.1 L 645.0 398.0 Q 645.0 414.0 630.7 421.2 L 415.7 529.1 Q 378.0 548.0 378.0 505.9 L 378.0 404.0 Q 378.0 388.0 392.3 380.8 Z M 471.7 397.1 L 539.7 362.7 Q 559.0 353.0 559.0 374.6 L 559.0 392.4 Q 559.0 401.0 551.3 404.9 L 483.3 439.3 Q 464.0 449.0 464.0 427.4 L 464.0 409.6 Q 464.0 401.0 471.7 397.1 Z"/>

    <!-- Rhombus 2 (even 40px gap from rhombus 1) -->
    <path fill-rule="evenodd" d="M 392.3 580.8 L 607.3 472.9 Q 645.0 454.0 645.0 496.1 L 645.0 598.0 Q 645.0 614.0 630.7 621.2 L 415.7 729.1 Q 378.0 748.0 378.0 705.9 L 378.0 604.0 Q 378.0 588.0 392.3 580.8 Z M 471.7 597.1 L 539.7 562.7 Q 559.0 553.0 559.0 574.6 L 559.0 592.4 Q 559.0 601.0 551.3 604.9 L 483.3 639.3 Q 464.0 649.0 464.0 627.4 L 464.0 609.6 Q 464.0 601.0 471.7 597.1 Z"/>

    <!-- Rhombus 3 (even 40px gap from rhombus 2) -->
    <path fill-rule="evenodd" d="M 392.3 780.8 L 607.3 672.9 Q 645.0 654.0 645.0 696.1 L 645.0 798.0 Q 645.0 814.0 630.7 821.2 L 415.7 929.1 Q 378.0 948.0 378.0 905.9 L 378.0 804.0 Q 378.0 788.0 392.3 780.8 Z M 471.7 797.1 L 539.7 762.7 Q 559.0 753.0 559.0 774.6 L 559.0 792.4 Q 559.0 801.0 551.3 804.9 L 483.3 839.3 Q 464.0 849.0 464.0 827.4 L 464.0 809.6 Q 464.0 801.0 471.7 797.1 Z"/>
  </g>

  <!-- Dark gap / halo around telemetry line matching background -->
  <path d="M 92 560 L 238 560 L 336 448 L 449 650 L 563 486 L 672 566 L 792 394 L 932 394"
        fill="none"
        stroke="#010a48"
        stroke-width="72"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="932" cy="394" r="48" fill="#010a48"/>

  <!-- Pink telemetry line overlay -->
  <path d="M 92 560 L 238 560 L 336 448 L 449 650 L 563 486 L 672 566 L 792 394 L 932 394"
        fill="none"
        stroke="#ee8b9d"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="932" cy="394" r="26" fill="#ee8b9d"/>
</svg>
